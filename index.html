<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품 정보 검색기</title>
    <link href='/style.css' rel='stylesheet'>
</head>
<body>
    <h1>상품 정보 검색 (Google Sheets 연동)</h1>
    
    <div class="search-container">
        <!-- 텍스트 검색 영역 -->
        <div class="input-group">
            <label for="product-name">검색어 입력:</label>
            <input type="text" id="product-name" placeholder="상품명, 마스터코드, 바코드 입력" />
        </div>
        <div class="button-group">
            <button id="search-button" onclick="searchProduct()">검색</button>
        </div>
    </div>

    <div id="product-info"></div>

    <!-- 바코드 모달 오버레이 -->
    <div id="barcode-modal" class="modal-overlay" onclick="closeBarcode()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="modal-barcode-img" src="" alt="Barcode Image">
            <button class="modal-close-btn" onclick="closeBarcode()">닫기</button>
        </div>
    </div>

    <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
