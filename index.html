<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품 정보 검색기</title>
    <link href='/style.css' rel='stylesheet'>
</head>
<body>
    <h1>상품 정보 검색 (Google Sheets 연동)</h1>
    <div class="search-container">
        <label for="product-name">검색어:</label>
        <input type="text" id="product-name" placeholder="상품명, 마스터코드, 바코드 입력 (Enter 가능)" />
        <button id="search-button" onclick="searchProduct()">검색</button>
    </div>
    <div id="product-info"></div>
    <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
